<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clay Wheel</title>
<style>
:root{--panel:rgba(12,20,19,.82);--ink:#e8ece8;--line:rgba(255,255,255,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--panel:rgba(246,247,244,.9);--ink:#1c2523;--line:rgba(0,0,0,.22)}}
:root[data-theme="light"]{--panel:rgba(246,247,244,.9);--ink:#1c2523;--line:rgba(0,0,0,.22)}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#17231f;color:var(--ink);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;overflow:hidden;position:relative}
#c{flex:1;min-height:0;width:100%;display:block;touch-action:none;cursor:grab}
#hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);max-width:90%;padding:8px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);text-align:center;transition:opacity .6s;pointer-events:none}
#hint.gone{opacity:0}
#bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line)}
#bar label{display:flex;align-items:center;gap:8px}
#sw{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
#sw button.on{border-color:var(--ink)}
.b{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:6px 14px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style></head><body>
<canvas id="c" aria-label="Spinning pottery wheel with a lump of clay"></canvas>
<div id="hint">Drag the edge of the clay to shape it. Drag the top to stretch it.</div>
<div id="bar">
<label>Wheel speed <input id="sp" type="range" min="0" max="1" step=".01" value=".6"></label>
<div id="sw" role="group" aria-label="Clay colour"></div>
<button class="b" id="rs">New lump</button>
<button class="b" id="sn">Sound on</button>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),sp=document.getElementById('sp'),hint=document.getElementById('hint');
let W,Hc,dpr;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;Hc=cv.clientHeight;cv.width=W*dpr;cv.height=Hc*dpr}
addEventListener('resize',size);size();
const N=72,E=.26,cl=x=>Math.min(210,Math.max(8,x));
let H=190,r=new Float32Array(N),rt=new Float32Array(N),v=new Float32Array(N);
function reset(wob){H=190;for(let i=0;i<N;i++){const q=(i/(N-1)-.42)/.58;rt[i]=14+84*Math.sqrt(Math.max(0,1-q*q));r[i]=rt[i]*(wob?1.3:1);v[i]=0}}
reset(false);
const cols=[['Stoneware',[150,150,144]],['Earthenware',[176,100,68]],['Porcelain',[228,226,218]],['Blue clay',[90,112,130]],['Celadon',[150,180,152]],['Ochre',[198,152,62]],['Rose',[202,130,140]],['Plum',[114,82,114]],['Charcoal',[66,68,72]],['Sky',[142,178,206]]];
let col=cols[0][1];
const sw=document.getElementById('sw');
cols.forEach((c,i)=>{const b=document.createElement('button');b.style.background=`rgb(${c[1]})`;b.setAttribute('aria-label',c[0]);if(!i)b.className='on';b.onclick=()=>{col=c[1];[...sw.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};sw.appendChild(b)});
document.getElementById('rs').onclick=()=>reset(true);
const sh=(c,f,a=1)=>`rgba(${Math.min(255,c[0]*f)|0},${Math.min(255,c[1]*f)|0},${Math.min(255,c[2]*f)|0},${a})`;
const ry=i=>-i/(N-1)*H;
function radAt(t){t=Math.min(1,Math.max(0,t));const f=t*(N-1),i=Math.min(N-2,f|0),u=f-i;return r[i]*(1-u)+r[i+1]*u}
const grains=[];for(let k=0;k<170;k++)grains.push({a:Math.random()*6.283,t:Math.random(),s:.6+Math.random()*1.3});
let rot=0,sc=1,drag=false,mode='',wx=0,wy=0,squish=0;
/* audio */
let ac,hg,ng,snd=true;
function audioInit(){if(ac||!snd)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();
const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=52;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;hg=ac.createGain();hg.gain.value=0;o.connect(lp).connect(hg).connect(ac.destination);o.start();
const buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const n=ac.createBufferSource();n.buffer=buf;n.loop=true;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.8;ng=ac.createGain();ng.gain.value=0;n.connect(bp).connect(ng).connect(ac.destination);n.start()}catch(e){}}
document.getElementById('sn').onclick=function(){snd=!snd;this.textContent=snd?'Sound on':'Sound off';if(snd){audioInit();if(ac&&ac.resume)ac.resume()}};
/* input */
function pos(e){const b=cv.getBoundingClientRect();wx=((e.clientX-b.left)-W/2)/sc;wy=((e.clientY-b.top)-Hc*.8)/sc}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pos(e);audioInit();hint.classList.add('gone');
const d=Math.abs(wx);drag=true;
if(wy<-H+25&&wy>-H-90&&d<r[N-1]+70)mode='top';
else if(wy>10)mode='none';
else{const rr=radAt(-wy/H);mode=d>rr+90?'none':(d>=rr*.9?'pinch':'bulge')}});
cv.addEventListener('pointermove',e=>{pos(e);if(!drag||mode==='none')return;squish=1;const d=Math.abs(wx);
if(mode==='top'){const nh=Math.min(560,Math.max(90,-wy)),old=H;H+=(nh-H)*.35;const k=Math.pow(old/H,.5);for(let i=0;i<N;i++){rt[i]=cl(rt[i]*k);r[i]=cl(r[i]*k)}return}
let V0=0,V1=0;for(let i=0;i<N;i++)V0+=rt[i]*rt[i];
const w=new Float32Array(N);
for(let i=0;i<N;i++){const dy=wy-ry(i);w[i]=Math.exp(-dy*dy/1352);if(w[i]<.02)continue;
if(mode==='pinch')rt[i]+=(d-rt[i])*w[i]*.4;else if(d>rt[i])rt[i]+=(d-rt[i])*w[i]*.4;rt[i]=cl(rt[i])}
for(let i=0;i<N;i++)V1+=rt[i]*rt[i];
const f=Math.sqrt(V0/V1);for(let i=0;i<N;i++)rt[i]=cl(rt[i]*(1+(f-1)*.45*(1-w[i])))});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drag=false}));
/* sim */
function step(){const s=+sp.value;rot+=s*.09;squish*=.92;
if(!drag&&s>0)for(let i=1;i<N-1;i++)rt[i]+=((rt[i-1]+rt[i+1])/2-rt[i])*.004*s;
for(let i=0;i<N;i++){const l=r[Math.max(0,i-1)],q=r[Math.min(N-1,i+1)];
v[i]=(v[i]+(rt[i]-r[i])*.07+(l+q-2*r[i])*.05)*.93;r[i]=cl(r[i]+v[i])}
if(ac){const t=ac.currentTime;hg.gain.setTargetAtTime(snd?s*.05:0,t,.1);ng.gain.setTargetAtTime(snd?squish*s*.12:0,t,.05)}}
/* draw */
function draw(){
const target=Math.min(W/470,.74*Hc/Math.max(270,H+60));sc+=(target-sc)*.08;
const ox=W/2,oy=Hc*.8;
g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,Hc);
let bg=g.createLinearGradient(0,0,0,Hc);bg.addColorStop(0,'#2b3c3e');bg.addColorStop(1,'#15201c');g.fillStyle=bg;g.fillRect(0,0,W,Hc);
const by=oy+150*sc;let wd=g.createLinearGradient(0,by,0,Hc);wd.addColorStop(0,'#5a4531');wd.addColorStop(1,'#3a2c20');g.fillStyle=wd;g.fillRect(0,by,W,Hc-by);
g.save();g.translate(ox,oy);g.scale(sc,sc);
let st=g.createLinearGradient(-22,0,22,0);st.addColorStop(0,'#2d3538');st.addColorStop(.35,'#6a767a');st.addColorStop(1,'#232a2c');
g.fillStyle=st;g.fillRect(-22,10,44,140);
g.fillStyle='#262d30';g.beginPath();g.ellipse(0,150,115,20,0,0,6.283);g.fill();
g.fillStyle='#2f383b';g.beginPath();g.ellipse(0,16,150,150*E,0,0,6.283);g.fill();g.fillRect(-150,0,300,16);
g.fillStyle='#2f383b';g.beginPath();g.ellipse(0,16,150,150*E,0,0,Math.PI);g.fill();
let pg=g.createRadialGradient(-30,-10,10,0,0,160);pg.addColorStop(0,'#8a979b');pg.addColorStop(1,'#4b575b');
g.fillStyle=pg;g.beginPath();g.ellipse(0,0,150,150*E,0,0,6.283);g.fill();
g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(0,2,r[0]*1.12,r[0]*1.12*E,0,0,6.283);g.fill();
for(let i=0;i<N-1;i++){const a=r[i],b=r[i+1],ya=ry(i),yb=ry(i+1),m=Math.max(a,b);
const lf=Math.min(1.3,Math.max(.65,1-(b-a)*.12));
g.beginPath();
for(let k=0;k<=10;k++){const p=Math.PI*k/10;g.lineTo(-a*Math.cos(p),ya+E*a*Math.sin(p))}
for(let k=10;k>=0;k--){const p=Math.PI*k/10;g.lineTo(-b*Math.cos(p),yb+E*b*Math.sin(p))}
g.closePath();
const gr=g.createLinearGradient(-m,0,m,0);
gr.addColorStop(0,sh(col,.5*lf));gr.addColorStop(.24,sh(col,1.3*lf));gr.addColorStop(.5,sh(col,.95*lf));gr.addColorStop(1,sh(col,.36*lf));
g.fillStyle=gr;g.fill();g.strokeStyle=gr;g.lineWidth=.7;g.stroke()}
g.fillStyle='rgba(0,0,0,.3)';
for(const q of grains){const an=q.a+rot,c=Math.cos(an);if(c<0)continue;const rr=radAt(q.t);
g.beginPath();g.arc(rr*Math.sin(an),ry(q.t*(N-1))+E*rr*c,q.s,0,6.283);g.fill()}
const tr=r[N-1],ty=ry(N-1);
let cg=g.createRadialGradient(-tr*.3,ty-tr*E*.3,1,0,ty,tr+2);cg.addColorStop(0,sh(col,1.4));cg.addColorStop(1,sh(col,.9));
g.fillStyle=cg;g.beginPath();g.ellipse(0,ty,tr,tr*E,0,0,6.283);g.fill();
g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=1.2;g.stroke();
if(drag&&mode!=='none'){g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=2;g.beginPath();g.arc(wx,wy,14,0,6.283);g.stroke()}
g.restore()}
(function loop(){step();draw();requestAnimationFrame(loop)})();
</script></body></html>
