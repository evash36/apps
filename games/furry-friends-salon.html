<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Furry Friends Grooming Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EC;
    --pink:#FFD9E6;
    --pink-deep:#FF9EC1;
    --blue:#CFEAFF;
    --blue-deep:#8FCBFF;
    --purple:#C9AEF2;
    --purple-deep:#A57EE6;
    --coral:#FF9E7A;
    --ink:#5B4636;
    --ink-soft:#8A7566;
    --white:#FFFFFF;
    --shadow: 0 10px 28px rgba(139, 104, 74, 0.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 15% 10%, #FFF3E0 0%, var(--cream) 45%, #FDECE0 100%);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  h1,h2,h3,.headline{ font-family:'Baloo 2', cursive; font-weight:700; margin:0; }
  #app{
    position:relative; width:100vw; height:100vh;
    display:flex; flex-direction:column; align-items:center;
    overflow:hidden;
  }

  /* floating background bubbles */
  .bg-bubble{
    position:absolute; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.15));
    opacity:0.55; pointer-events:none;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0); }
    100%{ transform:translateY(-120vh) translateX(var(--drift, 20px)); }
  }

  /* top bar */
  #topbar{
    width:100%; max-width:900px;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 6px;
    z-index:5;
  }
  #backBtn{
    display:none;
    align-items:center; gap:6px;
    background:var(--white); border:none; border-radius:999px;
    padding:8px 16px 8px 12px; font-family:'Baloo 2'; font-weight:600; font-size:15px;
    color:var(--ink); box-shadow:var(--shadow); cursor:pointer;
  }
  #backBtn img{ width:20px; height:20px; }
  #title{
    font-size: clamp(20px, 4.2vw, 30px);
    color:var(--purple-deep);
    text-shadow: 0 2px 0 #fff;
    display:flex; align-items:center; gap:8px;
  }
  #title img{ width:32px; height:32px; }
  #galleryBtn{
    display:flex; align-items:center; gap:6px;
    background:var(--white); border:none; border-radius:999px;
    padding:8px 14px; font-family:'Baloo 2'; font-weight:600; font-size:14px;
    color:var(--ink); box-shadow:var(--shadow); cursor:pointer;
  }
  #galleryBtn img{ width:20px; height:20px; }

  /* screens */
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.35s ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* SELECT SCREEN */
  #selectScreen{ justify-content:center; padding-top:70px; }
  #selectScreen .sub{
    font-family:'Baloo 2'; color:var(--ink-soft); font-size:clamp(15px,2.6vw,19px);
    margin-bottom:22px; text-align:center;
  }
  #petGrid{
    display:flex; gap:26px; flex-wrap:wrap; justify-content:center; padding:0 20px; max-width:900px;
  }
  .pet-card{
    width:200px; background:var(--white); border-radius:28px; padding:22px 16px 18px;
    box-shadow:var(--shadow); cursor:pointer; text-align:center;
    border:4px solid transparent;
    transition: transform 0.18s ease, border-color 0.18s ease;
  }
  .pet-card:hover, .pet-card:active{ transform:translateY(-6px) scale(1.03); }
  .pet-card img{ width:96px; height:96px; }
  .pet-card .name{ font-family:'Baloo 2'; font-size:20px; font-weight:700; margin-top:6px; }
  .pet-card .desc{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .pet-card.dog{ border-color:#FFE1B8; }
  .pet-card.cat{ border-color:#DCE6F5; }
  .pet-card.bunny{ border-color:#FFE0EC; }

  /* GAME SCREEN */
  #gameScreen{ justify-content:flex-start; width:100%; }
  #stageHeader{
    display:flex; align-items:center; gap:10px; margin-top:2px;
  }
  #stageHeader img{ width:26px; height:26px; }
  #stageLabel{ font-family:'Baloo 2'; font-size:18px; color:var(--ink); }
  #progressWrap{
    width:min(70vw, 320px); height:14px; background:#F0E4D4; border-radius:999px;
    margin:8px auto 4px; overflow:hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
  }
  #progressFill{
    height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg, var(--coral), var(--pink-deep));
    transition:width 0.25s ease;
  }
  #hintText{
    font-size:13px; color:var(--ink-soft); font-family:'Nunito'; font-weight:700;
    margin-bottom:2px; text-align:center; min-height:16px;
  }
  #canvasWrap{
    position:relative; flex:1; width:100%; max-width:820px; display:flex; align-items:center; justify-content:center;
  }
  #gameCanvas{
    touch-action:none; cursor:pointer;
    max-width:100%; max-height:100%;
  }
  #nextBtn{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
    font-family:'Baloo 2'; font-weight:700; font-size:18px;
    background:linear-gradient(180deg, #7DE0A6, #4FC788); color:#fff; border:none;
    padding:12px 30px; border-radius:999px; box-shadow:0 8px 0 #339c67, var(--shadow);
    cursor:pointer; opacity:0; pointer-events:none; transition: all 0.25s ease;
  }
  #nextBtn.show{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #nextBtn:active{ transform:translateX(-50%) translateY(4px); box-shadow:0 4px 0 #339c67; }

  /* accessory tray */
  #tray{
    display:flex; gap:14px; justify-content:center; padding:10px 10px 16px; flex-wrap:wrap;
  }
  .acc-btn{
    width:66px; height:66px; border-radius:20px; background:var(--white);
    border:4px solid #eee; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: transform 0.15s ease, border-color 0.15s ease;
    position:relative;
  }
  .acc-btn img{ width:40px; height:40px; }
  .acc-btn.equipped{ border-color:var(--purple-deep); transform:scale(1.08); background:#F4EEFF; }
  .acc-btn:active{ transform:scale(0.94); }
  .treat-btn{ width:84px; height:84px; border-color:#FFD9A8; animation: treatBounce 1.1s ease-in-out infinite; transition: opacity 0.2s ease, transform 0.2s ease; }
  .treat-btn img{ width:52px; height:52px; }
  .treat-btn.given{ opacity:0; transform:scale(0.6); pointer-events:none; }
  @keyframes treatBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }

  /* photo / result screen */
  #photoScreen{ justify-content:center; }
  .polaroid{
    background:#fff; padding:14px 14px 42px; border-radius:10px; box-shadow:var(--shadow);
    transform:rotate(-2deg); animation: popIn 0.5s cubic-bezier(.2,1.6,.4,1);
  }
  .polaroid img{ width:min(60vw, 340px); display:block; border-radius:4px; background:#eee; }
  .polaroid .cap{ text-align:center; font-family:'Baloo 2'; font-size:18px; margin-top:10px; color:var(--ink); }
  @keyframes popIn{ 0%{ transform:rotate(-2deg) scale(0.4); opacity:0;} 100%{ transform:rotate(-2deg) scale(1); opacity:1;} }
  #photoActions{ display:flex; gap:14px; margin-top:26px; }
  .pill-btn{
    font-family:'Baloo 2'; font-weight:700; font-size:16px;
    background:var(--white); color:var(--ink); border:none;
    padding:12px 22px; border-radius:999px; box-shadow:var(--shadow); cursor:pointer;
  }
  .pill-btn.primary{ background:linear-gradient(180deg,#FFB08A,#FF8F63); color:#fff; }

  /* gallery drawer */
  #galleryDrawer{
    position:fixed; inset:0; background:rgba(90,60,40,0.35); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  #galleryDrawer.show{ opacity:1; pointer-events:auto; }
  #galleryPanel{
    background:var(--cream); width:100%; max-width:920px; max-height:78vh; border-radius:26px 26px 0 0;
    padding:18px 20px 26px; box-shadow:0 -10px 30px rgba(0,0,0,0.2);
    display:flex; flex-direction:column; transform:translateY(20px); transition:transform 0.25s ease;
    overflow:hidden;
  }
  #galleryDrawer.show #galleryPanel{ transform:translateY(0); }
  #galleryPanel h2{ font-size:22px; color:var(--purple-deep); }
  #galleryPanel .row{ display:flex; align-items:center; justify-content:space-between; }
  #closeGallery{
    background:none; border:none; font-size:26px; color:var(--ink-soft); cursor:pointer; line-height:1;
  }
  #galleryGrid{
    margin-top:14px; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:14px; padding-bottom:8px;
  }
  #galleryGrid .g-item{ background:#fff; border-radius:12px; padding:8px; box-shadow:var(--shadow); text-align:center; }
  #galleryGrid img{ width:100%; border-radius:8px; display:block; background:#eee; }
  #galleryGrid .g-name{ font-family:'Baloo 2'; font-size:13px; margin-top:6px; }
  #galleryEmpty{ font-size:14px; color:var(--ink-soft); text-align:center; padding:30px 0; }
</style>
</head>

<script>
(function(){
"use strict";

/* ---------- background floating bubbles ---------- */
const app = document.getElementById('app');
for(let i=0;i<10;i++){
  const b = document.createElement('div');
  b.className='bg-bubble';
  const size = 14 + Math.random()*34;
  b.style.width = size+'px'; b.style.height=size+'px';
  b.style.left = (Math.random()*100)+'vw';
  b.style.bottom = (-10 - Math.random()*40)+'vh';
  b.style.setProperty('--drift', (Math.random()*60-30)+'px');
  b.style.animationDuration = (14+Math.random()*14)+'s';
  b.style.animationDelay = (-Math.random()*20)+'s';
  app.appendChild(b);
}

/* ---------- audio engine (procedural, no external files) ---------- */
const AudioEngine = (function(){
  let ctx;
  function ensure(){ if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); } return ctx; }
  function noiseBuffer(c, dur){
    const buf = c.createBuffer(1, c.sampleRate*dur, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
    return buf;
  }
  function scrub(){
    const c = ensure();
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(c, 0.18);
    const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 900+Math.random()*500; bp.Q.value=0.8;
    const g = c.createGain(); g.gain.value=0.05;
    src.connect(bp).connect(g).connect(c.destination);
    src.start();
  }
  function brush(){
    const c = ensure();
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(c, 0.14);
    const hp = c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2500;
    const g = c.createGain(); g.gain.value=0.045;
    src.connect(hp).connect(g).connect(c.destination);
    src.start();
  }
  function pop(freq){
    const c = ensure();
    const o = c.createOscillator(); o.type='sine';
    const g = c.createGain();
    o.frequency.setValueAtTime(freq||500, c.currentTime);
    o.frequency.exponentialRampToValueAtTime((freq||500)*1.6, c.currentTime+0.08);
    g.gain.setValueAtTime(0.06, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.12);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime+0.13);
  }
  function click(){
    const c = ensure();
    const o = c.createOscillator(); o.type='triangle';
    const g = c.createGain();
    o.frequency.value = 700;
    g.gain.setValueAtTime(0.08, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.08);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime+0.09);
  }
  function chime(){
    const c = ensure();
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
      const o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=c.createGain();
      const t = c.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.09, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.55);
    });
  }
  function shutter(){
    const c = ensure();
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(c, 0.06);
    const g = c.createGain(); g.gain.value=0.15;
    src.connect(g).connect(c.destination);
    src.start();
  }
  function chomp(){
    const c = ensure();
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(c, 0.1);
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=800;
    const g = c.createGain();
    g.gain.setValueAtTime(0.18, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.12);
    src.connect(lp).connect(g).connect(c.destination);
    src.start();
    const o = c.createOscillator(); o.type='triangle';
    const og = c.createGain();
    o.frequency.setValueAtTime(180, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(90, c.currentTime+0.1);
    og.gain.setValueAtTime(0.1, c.currentTime);
    og.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.13);
    o.connect(og).connect(c.destination);
    o.start(); o.stop(c.currentTime+0.14);
  }
  function happyPet(kind){
    const c = ensure();
    const notes = kind==='dog' ? [220,330,440] : kind==='cat' ? [660,880,990] : [392,523,659];
    notes.forEach((f,i)=>{
      const o=c.createOscillator(); o.type= kind==='cat'?'sine':'triangle'; o.frequency.value=f;
      const g=c.createGain();
      const t = c.currentTime + i*0.1;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.08,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+0.3);
    });
  }
  return {scrub, brush, pop, click, chime, shutter, happyPet, chomp};
})();

/* ---------- canvas setup ---------- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const LOGICAL_W=800, LOGICAL_H=560;
function fitCanvas(){
  const wrap = document.getElementById('canvasWrap');
  const availW = wrap.clientWidth, availH = wrap.clientHeight;
  const scale = Math.min(availW/LOGICAL_W, availH/LOGICAL_H, 1.15);
  canvas.style.width = (LOGICAL_W*scale)+'px';
  canvas.style.height = (LOGICAL_H*scale)+'px';
  const dpr = window.devicePixelRatio||1;
  canvas.width = LOGICAL_W*dpr; canvas.height = LOGICAL_H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', fitCanvas);

/* ---------- helpers ---------- */
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(seedObj){ // simple deterministic-ish PRNG per call chain
  seedObj.seed = (seedObj.seed*9301+49297)%233280;
  return seedObj.seed/233280;
}
function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }

/* ---------- build fur-textured body onto offscreen canvas ---------- */
function buildBodyTexture(petKey){
  const pet = PETS[petKey];
  const off = document.createElement('canvas');
  off.width = LOGICAL_W; off.height = LOGICAL_H;
  const c = off.getContext('2d');
  const cx = LOGICAL_W/2, cy = LOGICAL_H/2 + 60;
  drawBodyShape(c, petKey, cx, cy);
  // fur texture strokes masked to shape
  c.save();
  c.globalCompositeOperation='source-atop';
  const rnd = {seed: petKey.length*777+13};
  const strokeCount = 140;
  for(let i=0;i<strokeCount;i++){
    const x = cx + (rand(rnd)-0.5)*260;
    const y = cy + (rand(rnd)-0.5)*260;
    const len = 5+rand(rnd)*8;
    const ang = -Math.PI/2 + (rand(rnd)-0.5)*1.4;
    c.strokeStyle = rand(rnd)>0.5 ? pet.furDark : pet.furLight;
    c.globalAlpha = 0.16 + rand(rnd)*0.14;
    c.lineWidth = 1.4;
    c.beginPath();
    c.moveTo(x,y);
    c.lineTo(x+Math.cos(ang)*len, y+Math.sin(ang)*len);
    c.stroke();
  }
  c.restore();
  c.globalAlpha=1;
  return {canvas:off, cx, cy};
}

/* ---------- body shape drawing per pet (also used for texture mask) ---------- */
function drawBodyShape(c, petKey, cx, cy){
  const pet = PETS[petKey];
  c.save();
  // soft ground shadow
  c.fillStyle='rgba(120,90,60,0.16)';
  c.beginPath(); c.ellipse(cx, cy+150, 130, 22, 0, 0, Math.PI*2); c.fill();

  if(petKey==='dog'){
    // tail
    c.fillStyle=pet.furDark;
    c.beginPath();
    c.moveTo(cx+92,cy+50);
    c.quadraticCurveTo(cx+150,cy+10,cx+128,cy-40);
    c.quadraticCurveTo(cx+112,cy+0,cx+80,cy+70);
    c.fill();
    // body
    const bodyGrad = c.createRadialGradient(cx-30,cy+20,20,cx,cy+30,150);
    bodyGrad.addColorStop(0,pet.furLight); bodyGrad.addColorStop(1,pet.fur);
    c.fillStyle=bodyGrad;
    c.beginPath(); c.ellipse(cx, cy+55, 105, 88, 0, 0, Math.PI*2); c.fill();
    // belly
    c.fillStyle=pet.belly;
    c.beginPath(); c.ellipse(cx, cy+90, 58, 42, 0, 0, Math.PI*2); c.fill();
    // paws
    c.fillStyle=pet.fur;
    [[-58,150],[10,158],[52,150]].forEach(p=>{ c.beginPath(); c.ellipse(cx+p[0],cy+p[1],20,14,0,0,Math.PI*2); c.fill(); });
    // ears (floppy)
    c.fillStyle=pet.furDark;
    c.beginPath(); c.moveTo(cx-64,cy-70); c.quadraticCurveTo(cx-104,cy-40,cx-78,cy+18); c.quadraticCurveTo(cx-56,cy-10,cx-64,cy-70); c.fill();
    c.beginPath(); c.moveTo(cx+64,cy-70); c.quadraticCurveTo(cx+104,cy-40,cx+78,cy+18); c.quadraticCurveTo(cx+56,cy-10,cx+64,cy-70); c.fill();
    // head
    const headGrad = c.createRadialGradient(cx-15,cy-92,10,cx,cy-72,66);
    headGrad.addColorStop(0,pet.furLight); headGrad.addColorStop(1,pet.fur);
    c.fillStyle=headGrad;

  else if(petKey==='cat'){

    // ears (pointy)

  else if(petKey==='bunny'){

    // head

    // cheeks/muzzle
    c.fillStyle=pet.belly;
    c.beginPath(); c.ellipse(cx-16, cy-24, 16, 12, 0, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(cx+16, cy-24, 16, 12, 0, 0, Math.PI*2); c.fill();
    // nose
    c.fillStyle='#E38FA0';
    c.beginPath(); c.moveTo(cx-5,cy-32); c.lineTo(cx+5,cy-32); c.lineTo(cx,cy-26); c.closePath(); c.fill();
    // whiskers
    c.strokeStyle='rgba(90,70,55,0.5)'; c.lineWidth=1.2;
    [-1,1].forEach(side=>{
      for(let i=0;i<2;i++){
        c.beginPath();
        c.moveTo(cx+side*14, cy-28+i*5);
        c.lineTo(cx+side*44, cy-32+i*8);
        c.stroke();
      }
    });
    // eyes
    drawEyes(c, cx-18,cy-50, cx+18,cy-50, 7, '#3C2A20');
  }
  c.restore();
}

function drawEyes(c,x1,y1,x2,y2,r,color,slit){
  [[x1,y1],[x2,y2]].forEach(p=>{
    c.fillStyle=color;
    c.beginPath(); c.ellipse(p[0],p[1],r,r*1.15,0,0,Math.PI*2); c.fill();
    if(slit){
      c.fillStyle='#1c1c1c';
      c.beginPath(); c.ellipse(p[0],p[1],r*0.3,r*1.05,0,0,Math.PI*2); c.fill();
    }
    c.fillStyle='rgba(255,255,255,0.9)';
    c.beginPath(); c.ellipse(p[0]-r*0.3,p[1]-r*0.35,r*0.28,r*0.28,0,0,Math.PI*2); c.fill();
  });
}

/* ---------- accessory drawing ---------- */
function drawAccessory(c, key, x, y, scale){
  const img = iconImgs[key];
  if(!img || !img.complete) return;
  const s = 46*scale;
  c.drawImage(img, x-s/2, y-s/2, s, s);
}

/* ---------- dirt / clump rendering ---------- */
function drawDirt(c, x, y, r, level){
  if(level<=0.01) return;
  c.save();
  c.globalAlpha = 0.55*level;
  const g = c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'#7C5432'); g.addColorStop(0.7,'#8F6640'); g.addColorStop(1,'rgba(143,102,64,0)');
  c.fillStyle=g;
  c.beginPath(); c.ellipse(x,y,r*(0.7+level*0.3),r*(0.55+level*0.25),0.3,0,Math.PI*2); c.fill();
  // speckles
  const rnd={seed: Math.floor(x*13+y*7)};
  c.globalAlpha = 0.5*level;
  for(let i=0;i<6;i++){
    const dx = (rand(rnd)-0.5)*r*1.3, dy=(rand(rnd)-0.5)*r*1.1;
    c.fillStyle='#6B4A2E';
    c.beginPath(); c.ellipse(x+dx,y+dy,2.5+rand(rnd)*2,2,0,0,Math.PI*2); c.fill();
  }
  c.restore();
}
function drawClump(c, x, y, len, tangle, seedBase){
  // tangle 1 = fully jagged/messy, 0 = smooth (nearly invisible, blended into fur)
  if(tangle<=0.03) return;
  const rnd={seed:seedBase};
  c.save();
  c.globalAlpha = 0.5*tangle + 0.15;
  c.strokeStyle = '#8A6A46';
  c.lineWidth = 2.4;
  c.lineCap='round';
  for(let i=0;i<5;i++){
    const ox = (rand(rnd)-0.5)*len*0.7;
    const baseAng = -Math.PI/2 + (rand(rnd)-0.5)*0.6;
    const jag = tangle;
    c.beginPath();
    let px = x+ox, py=y;
    c.moveTo(px,py);
    const segs=4;
    for(let s=1;s<=segs;s++){
      const t=s/segs;
      const jagOff = Math.sin(t*Math.PI*3 + i)* (10*jag);
      const sx = x+ox + Math.cos(baseAng)*len*t + jagOff*Math.cos(baseAng+Math.PI/2);
      const sy = y - len*t*0.8 + jagOff*Math.sin(baseAng+Math.PI/2)*0.3;
      c.lineTo(sx,sy);
    }
    c.stroke();
  }
  c.restore();
}

/* ---------- particles (bubbles / drips) ---------- */
function spawnBubble(x,y){
  state.particles.push({type:'bubble', x, y, vx:(Math.random()-0.5)*20, vy:-30-Math.random()*40, r:4+Math.random()*7, life:1});
}
function spawnDrip(x,y){
  state.particles.push({type:'drip', x, y, vx:(Math.random()-0.5)*6, vy:10, r:3+Math.random()*3, life:1});
}
function spawnSparkle(x,y){
  state.particles.push({type:'sparkle', x, y, vx:(Math.random()-0.5)*30, vy:-40-Math.random()*30, r:3+Math.random()*3, life:1, hue: Math.random()*360});
}
function updateParticles(dt){
  for(let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.type==='bubble'){ p.vy += -6*dt; p.life -= dt*0.7; }
    else if(p.type==='drip'){ p.vy += 260*dt; p.life -= dt*0.9; }
    else { p.vy += 30*dt; p.life -= dt*0.9; }
    if(p.life<=0) state.particles.splice(i,1);
  }
}
function drawParticles(c){
  state.particles.forEach(p=>{
    c.save();
    c.globalAlpha = Math.max(0,p.life);
    if(p.type==='bubble'){
      c.strokeStyle='rgba(255,255,255,0.9)';
      c.fillStyle='rgba(210,240,255,0.35)';
      c.lineWidth=1.5;
      c.beginPath(); c.arc(p.x,p.y,p.r,0,Math.PI*2); c.fill(); c.stroke();
    } else if(p.type==='drip'){
      c.fillStyle='rgba(180,220,255,0.85)';
      c.beginPath(); c.ellipse(p.x,p.y,p.r*0.7,p.r,0,0,Math.PI*2); c.fill();
    } else {
      c.fillStyle=`hsl(${p.hue},85%,75%)`;
      c.beginPath();
      for(let k=0;k<4;k++){
        const ang = k*Math.PI/2;
        c.moveTo(p.x,p.y);
        c.lineTo(p.x+Math.cos(ang)*p.r*2, p.y+Math.sin(ang)*p.r*2);
      }
      c.lineWidth=1.6; c.strokeStyle=`hsl(${p.hue},85%,70%)`; c.stroke();
    }
    c.restore();
  });
}

/* ---------- main render ---------- */
function render(){
  ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
  if(!state.petKey) return;
  const tex = furTextureCache[state.petKey];
  ctx.drawImage(tex.canvas,0,0);
  const cx = tex.cx, cy = tex.cy;
  const pet = PETS[state.petKey];

  if(state.stage==='wash'){
    pet.dirtSpots.forEach((spot,i)=> drawDirt(ctx, cx+spot.dx, cy+spot.dy, spot.r, state.dirt[i]));
  }
  if(state.stage==='brush'){
    pet.clumps.forEach((cl,i)=> drawClump(ctx, cx+cl.dx, cy+cl.dy, cl.len, state.clumpTangle[i], i*97+13));
  }
  if(state.stage==='style' || state.stage==='treat'){
    Object.entries(state.equipped).forEach(([zone,acc])=>{
      if(!acc) return;
      const z = pet.zones[zone];
      drawAccessory(ctx, acc, cx+z.dx, cy+z.dy, 1.15);
    });
  }
  if(state.stage==='style'){
    // faint snap-zone rings to invite tapping
    Object.entries(pet.zones).forEach(([zone,z])=>{
      if(state.equipped[zone]) return;
      ctx.save();
      ctx.globalAlpha=0.28 + 0.1*Math.sin(performance.now()/400);
      ctx.strokeStyle='#C9AEF2'; ctx.setLineDash([4,5]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx+z.dx, cy+z.dy, 26, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    });
  }
  if(state.stage==='treat' && state.treatAnim){
    const spot = pet.treatSpot;
    const mx = cx+spot.dx, my = cy+spot.dy;
    const t = Math.min(1, (performance.now()-state.treatAnim.start)/state.treatAnim.duration);
    const ease = 1-Math.pow(1-t,3);
    const scale = 1 - ease*0.85;
    ctx.save();
    ctx.globalAlpha = 1-ease*0.6;
    drawAccessory(ctx, pet.treatIcon, mx, my, 1.3*scale);
    ctx.restore();
    if(t>=1 && !state.treatDone){
      state.treatDone = true;
      AudioEngine.chomp();
      spawnSparkle(mx,my); spawnSparkle(mx+12,my-8); spawnSparkle(mx-12,my-4);
      hintText.textContent = `${pet.name} loves it!`;
      setTimeout(()=> finishGrooming(), 500);
    }
  }

  drawParticles(ctx);

  // sponge / brush cursor
  if((state.stage==='wash'||state.stage==='brush') && state.pointer.x>-500){
    ctx.save();
    ctx.globalAlpha=0.85;
    if(state.stage==='wash'){
      ctx.fillStyle='#FFE9A8'; ctx.strokeStyle='#E8C86A'; ctx.lineWidth=2;
      roundedSquare(ctx, state.pointer.x-16, state.pointer.y-14, 32, 26, 8);
      ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle='#D9B896'; ctx.strokeStyle='#B98F65'; ctx.lineWidth=2;
      roundedSquare(ctx, state.pointer.x-6, state.pointer.y-22, 12, 30, 5);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle='#8A6A46';
      ctx.fillRect(state.pointer.x-14, state.pointer.y+6, 28, 10);
    }
    ctx.restore();
  }
}
function roundedSquare(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* ---------- loop ---------- */
let lastTime=performance.now();
function loop(t){
  const dt = Math.min(0.05,(t-lastTime)/1000);
  lastTime=t;
  updateParticles(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- interaction ---------- */
function getPos(evt){
  const rect = canvas.getBoundingClientRect();
  const cxy = evt.touches ? evt.touches[0] : evt;
  const x = (cxy.clientX-rect.left) * (LOGICAL_W/rect.width);
  const y = (cxy.clientY-rect.top) * (LOGICAL_H/rect.height);
  return {x,y};
}
function onDown(evt){
  evt.preventDefault();
  const p = getPos(evt);
  state.pointer.down=true; state.pointer.x=p.x; state.pointer.y=p.y;
  state.pointer.lastX=p.x; state.pointer.lastY=p.y;
  if(state.stage==='style') handleStyleTap(p.x,p.y);
}
function onMove(evt){
  const p = getPos(evt);
  state.pointer.x=p.x; state.pointer.y=p.y;
  if(!state.pointer.down) return;
  if(state.stage==='wash') doWash(p.x,p.y);
  if(state.stage==='brush') doBrush(p.x,p.y);
  state.pointer.lastX=p.x; state.pointer.lastY=p.y;
}
function onUp(){ state.pointer.down=false; }
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove', onMove, {passive:false});
canvas.addEventListener('touchend', onUp);

let scrubCooldown=0, brushCooldown=0, dripCooldown=0;
function doWash(x,y){
  const tex = furTextureCache[state.petKey];
  const pet = PETS[state.petKey];
  let touching=false;
  pet.dirtSpots.forEach((spot,i)=>{
    const sx=tex.cx+spot.dx, sy=tex.cy+spot.dy;
    if(dist(x,y,sx,sy) < spot.r*0.9 && state.dirt[i]>0){
      touching=true;
      state.dirt[i] = Math.max(0, state.dirt[i]-0.018);
      if(Math.random()<0.5) spawnBubble(x+(Math.random()-0.5)*14,y+(Math.random()-0.5)*14);
    }
  });
  if(touching){
    scrubCooldown-=1;
    if(scrubCooldown<=0){ AudioEngine.scrub(); scrubCooldown=6; }
  }
  dripCooldown-=1;
  if(dripCooldown<=0){ spawnDrip(x,y+6); dripCooldown=10; }
  updateWashProgress();
}
function doBrush(x,y){
  const tex = furTextureCache[state.petKey];
  const pet = PETS[state.petKey];
  let touching=false;
  pet.clumps.forEach((cl,i)=>{
    const sx=tex.cx+cl.dx, sy=tex.cy+cl.dy - cl.len*0.4;
    if(dist(x,y,sx,sy) < cl.len*0.9 && state.clumpTangle[i]>0){
      touching=true;
      state.clumpTangle[i] = Math.max(0, state.clumpTangle[i]-0.02);
      if(Math.random()<0.35) spawnSparkle(x,y);
    }
  });
  if(touching){
    brushCooldown-=1;
    if(brushCooldown<=0){ AudioEngine.brush(); brushCooldown=6; }
  }
  updateBrushProgress();
}
function handleStyleTap(x,y){
  const tex = furTextureCache[state.petKey];
  const pet = PETS[state.petKey];
  Object.entries(pet.zones).forEach(([zone,z])=>{
    const zx=tex.cx+z.dx, zy=tex.cy+z.dy;
    if(dist(x,y,zx,zy)<30 && state.equipped[zone]){
      state.equipped[zone]=null;
      AudioEngine.click();
      refreshTray();
    }
  });
}

/* ---------- progress ---------- */
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const nextBtn = document.getElementById('nextBtn');
const hintText = document.getElementById('hintText');
function updateWashProgress(){
  const avgDirty = state.dirt.reduce((a,b)=>a+b,0)/state.dirt.length;
  const pct = Math.round((1-avgDirty)*100);
  progressFill.style.width = pct+'%';
  if(pct>=97 && !state.advancing){ finishStageSoon(); }
}
function updateBrushProgress(){
  const avgTangle = state.clumpTangle.reduce((a,b)=>a+b,0)/state.clumpTangle.length;
  const pct = Math.round((1-avgTangle)*100);
  progressFill.style.width = pct+'%';
  if(pct>=97 && !state.advancing){ finishStageSoon(); }
}
function finishStageSoon(){
  state.advancing=true;
  AudioEngine.pop(700);
  setTimeout(()=>{ nextBtn.classList.add('show'); }, 250);
}

/* ---------- tray (style stage) ---------- */
const trayEl = document.getElementById('tray');
function buildTray(){
  trayEl.innerHTML='';
  Object.keys(ACCESSORY_ZONE).forEach(key=>{
    const btn = document.createElement('div');
    btn.className='acc-btn'; btn.dataset.acc=key;
    const img = document.createElement('img');
    img.src = iconImgs[key].src; img.alt=key;
    btn.appendChild(img);
    btn.addEventListener('click', ()=>{
      const zone = ACCESSORY_ZONE[key];
      state.equipped[zone] = (state.equipped[zone]===key) ? null : key;
      AudioEngine.click();
      refreshTray();
      checkStyleDone();
    });
    trayEl.appendChild(btn);
  });
}
function refreshTray(){
  [...trayEl.children].forEach(btn=>{
    const key = btn.dataset.acc;
    const zone = ACCESSORY_ZONE[key];
    btn.classList.toggle('equipped', state.equipped[zone]===key);
  });
}
function checkStyleDone(){
  const anyEquipped = Object.values(state.equipped).some(v=>v);
  if(anyEquipped && !state.advancing){
    state.advancing=true;
    setTimeout(()=>{ nextBtn.classList.add('show'); }, 200);
  }
}
function buildTreatTray(){
  trayEl.innerHTML='';
  const pet = PETS[state.petKey];
  const btn = document.createElement('div');
  btn.className='acc-btn treat-btn';
  const img = document.createElement('img');
  img.src = iconImgs[pet.treatIcon].src;
  img.alt = pet.treatIcon;
  btn.appendChild(img);
  btn.addEventListener('click', ()=>{
    if(state.treatAnim) return;
    AudioEngine.click();
    state.treatAnim = { start: performance.now(), duration: 700 };
    btn.classList.add('given');
  });
  trayEl.appendChild(btn);
}

/* ---------- stage flow ---------- */
const stageIcon = document.getElementById('stageIcon');
const stageLabel = document.getElementById('stageLabel');
const backBtn = document.getElementById('backBtn');

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startPet(petKey){
  state.petKey=petKey;
  state.equipped={head:null,face:null,neck:null};
  if(!furTextureCache[petKey]) furTextureCache[petKey]=buildBodyTexture(petKey);
  showScreen('gameScreen');
  backBtn.style.display='flex';
  enterStage('wash');
}

nextBtn.addEventListener('click', ()=>{
  AudioEngine.click();
  if(state.stage==='wash') enterStage('brush');
  else if(state.stage==='brush') enterStage('style');
  else if(state.stage==='style') enterStage('treat');
});
backBtn.addEventListener('click', ()=>{
  backBtn.style.display='none';
  showScreen('selectScreen');
  state.petKey=null;
});

/* ---------- pet select ---------- */
document.querySelectorAll('.pet-card').forEach(card=>{
  card.addEventListener('click', ()=>{ AudioEngine.click(); startPet(card.dataset.pet); });
});

/* ---------- finish + photo ---------- */
let jsConfetti;
try{ jsConfetti = new JSConfetti(); }catch(e){ jsConfetti=null; }

function finishGrooming(){
  const pet = PETS[state.petKey];
  AudioEngine.chime();
  AudioEngine.happyPet(state.petKey);
  if(jsConfetti){
    jsConfetti.addConfetti({ confettiColors:['#FFB6C1','#C9AEF2','#8FCBFF','#FFE1A8','#B6F0C9'], confettiNumber: 90 });
  }
  setTimeout(()=>{ AudioEngine.shutter(); capturePhoto(); }, 500);
}
function capturePhoto(){
  // render one final clean frame (no cursor/particles) at full res for the photo
  const off = document.createElement('canvas');
  off.width=LOGICAL_W; off.height=LOGICAL_H;
  const oc = off.getContext('2d');
  const tex = furTextureCache[state.petKey];
  oc.fillStyle='#FDEFE0';
  oc.beginPath();
  const grad = oc.createRadialGradient(LOGICAL_W/2,LOGICAL_H/2,50,LOGICAL_W/2,LOGICAL_H/2,420);
  grad.addColorStop(0,'#FFF6E9'); grad.addColorStop(1,'#FBE3D0');
  oc.fillStyle=grad;
  oc.fillRect(0,0,LOGICAL_W,LOGICAL_H);
  oc.drawImage(tex.canvas,0,0);
  const pet = PETS[state.petKey];
  Object.entries(state.equipped).forEach(([zone,acc])=>{
    if(!acc) return;
    const z = pet.zones[zone];
    drawAccessory(oc, acc, tex.cx+z.dx, tex.cy+z.dy, 1.15);
  });
  const dataUrl = off.toDataURL('image/png');
  document.getElementById('photoImg').src = dataUrl;
  document.getElementById('photoCap').textContent = pet.caption;
  saveToGallery(pet.name, state.petKey, dataUrl);
  showScreen('photoScreen');
}

/* ---------- gallery (localStorage) ---------- */
const GALLERY_KEY='furryFriendsGallery';
function loadGallery(){
  try{ return JSON.parse(localStorage.getItem(GALLERY_KEY))||[]; }catch(e){ return []; }
}
function saveToGallery(name, petKey, dataUrl){
  const gal = loadGallery();
  gal.unshift({ name, petKey, dataUrl, ts: Date.now() });
  try{ localStorage.setItem(GALLERY_KEY, JSON.stringify(gal.slice(0,40))); }catch(e){}
}
function renderGallery(){
  const grid = document.getElementById('galleryGrid');
  const gal = loadGallery();
  grid.innerHTML='';
  if(gal.length===0){
    grid.innerHTML = '<div id="galleryEmpty">No groomed friends yet — finish a makeover to add one here!</div>';
    return;
  }
  gal.forEach(item=>{
    const d = document.createElement('div'); d.className='g-item';
    const img = document.createElement('img'); img.src=item.dataUrl;
    const name = document.createElement('div'); name.className='g-name'; name.textContent=item.name;
    d.appendChild(img); d.appendChild(name);
    grid.appendChild(d);
  });
}
const galleryDrawer = document.getElementById('galleryDrawer');
function openGallery(){ renderGallery(); galleryDrawer.classList.add('show'); }
document.getElementById('galleryBtn').addEventListener('click', openGallery);
document.getElementById('galleryFromPhoto').addEventListener('click', openGallery);
document.getElementById('closeGallery').addEventListener('click', ()=> galleryDrawer.classList.remove('show'));
galleryDrawer.addEventListener('click', (e)=>{ if(e.target===galleryDrawer) galleryDrawer.classList.remove('show'); });

document.getElementById('groomAnother').addEventListener('click', ()=>{
  showScreen('selectScreen');
  backBtn.style.display='none';
  state.petKey=null;
});

/* ---------- init ---------- */
fitCanvas();
})();
