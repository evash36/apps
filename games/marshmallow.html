<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marshmallow Works</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfeee9;--ink:#3a2f3d;--bar:#fff;--acc:#e8708a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2b2a;--ink:#f3e9ee;--bar:#3a4a49}}
:root[data-theme="dark"]{--bg:#1f2b2a;--ink:#f3e9ee;--bar:#3a4a49}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:12px}
h1{font-size:1.4rem;margin:4px 0}
#tip{min-height:1.5em;margin:4px 0 8px}
#bar{height:12px;border-radius:6px;background:var(--bar);overflow:hidden;margin-bottom:8px}
#fill{height:100%;width:0;background:var(--acc);transition:width .1s}
canvas{width:100%;height:auto;display:block;border-radius:16px;touch-action:none;background:#cfe3dd}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
button{font:600 1rem Fredoka,system-ui,sans-serif;padding:12px 20px;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style></head><body><main>
<h1>Marshmallow Works</h1>
<div id="tip"></div><div id="bar"><div id="fill"></div></div>
<canvas id="c" width="800" height="560"></canvas>
<div class="row" id="row"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const C=document.getElementById('c'),g=C.getContext('2d'),W=800,H=560;
const FL={Vanilla:['#fff6e0','#ecd7a0'],Strawberry:['#ffc9d5','#ee93aa'],Matcha:['#dcefc4','#a9cf80'],Chocolate:['#b88a6c','#7a4f38'],Blueberry:['#c5c8f5','#8e92d6'],Mango:['#ffe08a','#f5b73f'],Lavender:['#e4d3f5','#b99ce0'],Rainbow:['#fff1f8','#d9c9ee']};
const BX=400,BY=330,BR=200,TY0=190,TY1=470,MAXL=1600;
let flavor,stage=0,prog=0,strokes=[],ropeLen=0,lastA=null,ptr={x:0,y:0,d:false},eng,bodies=[],ac;
const $=id=>document.getElementById(id);
function snd(f,d=.07,t='sine',v=.05){try{ac=ac||new AudioContext();const o=ac.createOscillator(),a=ac.createGain();o.type=t;o.frequency.value=f;a.gain.setValueAtTime(v,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
C.onpointerdown=e=>{ptr={...pos(e),d:true};lastA=null;if(stage==2)strokes.push([]);C.setPointerCapture(e.pointerId)};
C.onpointerup=()=>{ptr.d=false;lastA=null};
C.onpointermove=e=>{const p=pos(e),px=ptr.x,py=ptr.y;ptr.x=p.x;ptr.y=p.y;if(!ptr.d)return;
 if(stage==1){const a=Math.atan2(p.y-BY,p.x-BX);if(Math.hypot(p.x-BX,(p.y-BY)*1.6)<BR){
   if(lastA!==null){let d=a-lastA;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;prog=Math.min(1,prog+Math.abs(d)/50);if(Math.random()<.25)snd(180+prog*320,.05,'triangle',.03)}
   lastA=a}else lastA=null;upd()}
 else if(stage==2&&p.y>TY0&&p.y<TY1&&p.x>40&&p.x<760&&ropeLen<MAXL){
   const s=strokes[strokes.length-1],l=s[s.length-1];
   if(!l||Math.hypot(p.x-l.x,p.y-l.y)>6){if(l)ropeLen+=Math.hypot(p.x-l.x,p.y-l.y);s.push({x:p.x,y:p.y});if(Math.random()<.2)snd(300,.04,'sine',.03);upd()}}
 else if(stage==3){for(const b of bodies){const dx=b.position.x-p.x,dy=b.position.y-p.y;if(Math.hypot(dx,dy)<60){Matter.Body.setVelocity(b,{x:(p.x-px)*.5+dx*.05,y:(p.y-py)*.5-2});}}}};
function setTip(t){$('tip').textContent=t}
function upd(){let v=stage==1?prog:stage==2?ropeLen/MAXL:0;$('fill').style.width=v*100+'%';const b=$('go');
 if(b)b.disabled=stage==1?prog<1:stage==2?ropeLen<250:false}
function menu(){stage=0;$('fill').style.width='0';setTip('Pick a flavor for your first batch.');
 $('row').innerHTML='';for(const k in FL){const b=document.createElement('button');b.textContent=k;b.onclick=()=>begin(k);$('row').append(b)}}
function begin(k){flavor=k;stage=1;prog=0;strokes=[];ropeLen=0;setTip('Whip the syrup: drag in circles inside the bowl until it turns thick and fluffy.');
 $('row').innerHTML='<button id="go">Pipe it</button>';$('go').onclick=next;upd()}
function next(){if(stage==1){stage=2;setTip('Pipe a rope onto the tray: drag to draw. A longer rope makes more marshmallows.');$('go').textContent='Cut and dust';upd();snd(500,.12)}
 else if(stage==2){stage=3;spawn();$('go').textContent='New batch';$('go').onclick=menu;$('fill').style.width='0';snd(700,.15,'triangle')}}
function spawn(){const M=Matter;eng=M.Engine.create();const n=Math.min(70,Math.floor(ropeLen/38));bodies=[];
 setTip(n+' marshmallows, cut and dusted. Poke them around in the jar.');
 const wall=(x,y,w,h)=>M.Bodies.rectangle(x,y,w,h,{isStatic:true});
 M.Composite.add(eng.world,[wall(400,535,320,30),wall(235,330,30,460),wall(565,330,30,460)]);
 for(let i=0;i<n;i++){const b=M.Bodies.rectangle(290+Math.random()*220,-30-i*45,34,34,{chamfer:{radius:10},restitution:.45,friction:.5,frictionAir:.012,angle:Math.random()*3});b.h=flavor=='Rainbow'?(i*37)%360:null;bodies.push(b)}
 M.Composite.add(eng.world,bodies)}
function blob(x,y,r,c0,c1){const q=g.createRadialGradient(x-r*.3,y-r*.4,r*.1,x,y,r);q.addColorStop(0,c0);q.addColorStop(1,c1);g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function room(){const w=g.createLinearGradient(0,0,0,H);w.addColorStop(0,'#d6ebe5');w.addColorStop(1,'#bcd9d1');g.fillStyle=w;g.fillRect(0,0,W,H);
 for(let y=0;y<300;y+=50)for(let x=(y/50%2)*40;x<W;x+=80){g.strokeStyle='rgba(255,255,255,.35)';g.strokeRect(x,y,80,50)}
 const c=g.createLinearGradient(0,430,0,H);c.addColorStop(0,'#c99a68');c.addColorStop(1,'#a8784a');g.fillStyle=c;g.fillRect(0,430,W,130);g.fillStyle='rgba(0,0,0,.12)';g.fillRect(0,430,W,5)}
function bowl(){const [c0,c1]=FL[flavor];g.save();g.translate(BX,BY);g.scale(1,.62);
 blob(0,0,BR+14,'#f2f4f6','#7d8791');g.restore();
 g.save();g.translate(BX,BY);g.scale(1,.62);g.fillStyle='#5f6870';g.beginPath();g.arc(0,0,BR,0,7);g.fill();g.restore();
 const r=BR-14,k=prog;g.save();g.translate(BX,BY+10-k*34);g.scale(1,.62);
 const q=g.createRadialGradient(-40,-40,10,0,0,r);q.addColorStop(0,k>.5?c0:'#f6e7b8');q.addColorStop(1,k>.5?c1:'#d9a85a');g.fillStyle=q;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.restore();
 if(k>.35){for(let i=0;i<14;i++){const a=i*2.4,d=(i%5)*20+10;blob(BX+Math.cos(a)*d*1.3,BY-k*30+Math.sin(a)*d*.55,22*k+6,flavor=='Rainbow'?'hsl('+i*26+',90%,86%)':'#ffffff',flavor=='Rainbow'?'hsl('+i*26+',80%,70%)':c0)}}
 g.strokeStyle='#e8ecef';g.lineWidth=5;g.lineCap='round';
 if(ptr.d||stage==1){g.beginPath();g.moveTo(ptr.x,ptr.y-70);g.lineTo(ptr.x,ptr.y);g.stroke();g.beginPath();g.ellipse(ptr.x,ptr.y,14,8,0,0,7);g.stroke()}}
function tray(){g.fillStyle='rgba(0,0,0,.18)';g.fillRect(48,TY0+10,720,TY1-TY0);const t=g.createLinearGradient(0,TY0,0,TY1);t.addColorStop(0,'#d9dee3');t.addColorStop(1,'#a9b2ba');g.fillStyle=t;g.fillRect(40,TY0,720,TY1-TY0);
 g.fillStyle='rgba(255,255,255,.75)';g.fillRect(56,TY0+14,688,TY1-TY0-28);
 const [c0,c1]=FL[flavor];g.lineCap='round';g.lineJoin='round';
 const R=flavor=='Rainbow';
 for(const [w,col,dy,L] of [[34,'rgba(0,0,0,.18)',5],[30,c1,0,66],[24,c0,-1,80],[8,'rgba(255,255,255,.8)',-6]]){g.strokeStyle=col;g.lineWidth=w;let n=0;for(const s of strokes){if(!s.length)continue;
  if(R&&L){for(let i=0;i<s.length;i++,n++){g.strokeStyle='hsl('+(n*4)%360+',85%,'+L+'%)';g.beginPath();const a=s[Math.max(0,i-1)];g.moveTo(a.x,a.y+dy);g.lineTo(s[i].x+.1,s[i].y+dy);g.stroke()}continue}
  g.beginPath();g.moveTo(s[0].x,s[0].y+dy);for(const p of s)g.lineTo(p.x,p.y+dy);if(s.length==1)g.lineTo(s[0].x+.1,s[0].y+dy);g.stroke()}}}
function jar(){g.fillStyle='rgba(255,255,255,.28)';g.fillRect(250,200,300,350);g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=6;g.strokeRect(250,200,300,345);
 const [c0,c1]=FL[flavor];for(const b of bodies){g.save();g.translate(b.position.x,b.position.y);g.rotate(b.angle);
  const q=g.createLinearGradient(-17,-17,17,17);const hh=b.h;q.addColorStop(0,hh!=null?'hsl('+hh+',90%,85%)':c0);q.addColorStop(1,hh!=null?'hsl('+hh+',80%,68%)':c1);g.fillStyle=q;g.beginPath();g.roundRect(-17,-17,34,34,10);g.fill();
  g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.roundRect(-12,-13,14,6,3);g.fill();g.restore()}}
function loop(){room();if(stage==0){blob(400,300,90,'#fff','#f3d9e1');g.fillStyle='#3a2f3d';g.font='600 34px Fredoka,system-ui';g.textAlign='center';g.fillText('Marshmallow Works',400,420)}
 else if(stage==1)bowl();else if(stage==2)tray();else{Matter.Engine.update(eng,1000/60);jar()}
 requestAnimationFrame(loop)}
menu();loop();
</script></body></html>
