</style></head><body>
<canvas id="c"></canvas>
<div id="rcpt"></div>
<div id="bar"><button id="bL" class="g">&#9664;</button><button id="bR" class="g">&#9654;</button><button id="bP" class="k">Cashier</button><button id="bH" class="g">Take home</button><button id="bX">Restock</button></div>

<script>

const TYPES=['can','can','box','box','bottle','carton','bread','apple','apple','orange'];

const PR={can:1.2,box:3.5,bottle:2.8,carton:1.9,bread:2.5,apple:.6,orange:.7,icecream:4.5,pizza:6.9,tybag:3.8,ball:.4};
const NM={can:'Beans',box:'Cereal',bottle:'Juice',carton:'Milk',bread:'Bread',apple:'Apple',orange:'Orange',icecream:'Ice cream',pizza:'Pizza',tybag:'Tang yuan',ball:'Tang yuan'};

function restock(){

}
function pour(b){
  const p=b.position;Composite.remove(world,b);items.splice(items.indexOf(b),1);objs.splice(objs.indexOf(b),1);inCart.delete(b);

function buildBg(){

  g.fillStyle='#fff';g.font='700 '+(22*u)+'px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('FRESH MARKET',W/2,10*u+(top>56*u?20*u:15*u));

    g.fillStyle='#8c99a3';g.fillRect(14*u,sy,W-28*u,10*u);g.fillStyle='#e3eaee';g.fillRect(14*u,sy,W-28*u,3*u);
    for(let x=40*u;x<W-60*u;x+=64*u){g.fillStyle='#fff';g.fillRect(x,sy+10*u,34*u,14*u);g.fillStyle='#c1121f';g.font='700 '+(10*u)+'px system-ui';g.textAlign='left';g.fillText('$'+(1+Math.floor(Math.random()*9))+'.'+(10+Math.floor(Math.random()*89)),x+3*u,sy+17*u);}

  g.fillStyle='#2a6fdb';g.fillRect(fx,ft,FR,22*u);g.fillStyle='#fff';g.font='700 '+(14*u)+'px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText('FROZEN FOODS',fx+FR/2,ft+11*u);
  for(const sy of shelfYs){g.fillStyle='#8aa3b3';g.fillRect(fx+8*u,sy,FR-16*u,10*u);}

  g.fillStyle=lg(g,0,topY,0,floorY,['#c9d1d7','#8f9aa3']);g.fillRect(cx,topY,200*u,110*u);
  g.fillStyle='#6d7882';g.fillRect(cx,topY,200*u,6*u);

  g.fillStyle='#4b555d';g.fillRect(0,topC,240*u,5*u);

  g.fillStyle='#c1121f';g.fillRect(10*u,topC+22*u,220*u,26*u);g.fillStyle='#fff';g.font='700 '+(15*u)+'px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText('CHECKOUT 1',120*u,topC+35*u);
  g.fillStyle='#aeb6bc';g.beginPath();g.roundRect(22*u,topC-16*u,56*u,16*u,3*u);g.fill();g.fillStyle='#1b1f23';g.fillRect(30*u,topC-12*u,40*u,3*u);g.fillStyle='#fff';g.font='700 '+(7*u)+'px system-ui';g.fillText('RECEIPT',50*u,topC-5*u);

}
function init(){

  objs.push(Bodies.rectangle(120*u,floorY-45*u,240*u,90*u,so),Bodies.rectangle(236*u,topC-8*u,8*u,16*u,sh));
  objs.push(Bodies.rectangle(bagL+1.5*u,floorY-65*u,3*u,130*u,so),Bodies.rectangle(bagR-1.5*u,floorY-65*u,3*u,130*u,so));

const mouse=Mouse.create(cv);

const mc=MouseConstraint.create(engine,{mouse,constraint:{stiffness:.2,damping:.1,render:{visible:false}}});Composite.add(world,mc);

function audio(){

function tone(type,f,vol,dur){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);}

Events.on(engine,'beforeUpdate',()=>{

function shade(c){const n=parseInt(c.slice(1),16);const f=v=>Math.max(0,v-45);return '#'+((1<<24)+(f(n>>16)<<16)+(f((n>>8)&255)<<8)+f(n&255)).toString(16).slice(1);}
function drawCart(front){

    ctx.strokeStyle='#8d949a';ctx.lineWidth=3*u;ctx.beginPath();ctx.moveTo(L,B);ctx.lineTo(L-28*u,T-24*u);ctx.stroke();

    ctx.strokeStyle='#c4ccd2';ctx.lineWidth=4*u;ctx.strokeRect(L,T,R-L,B-T);
    ctx.strokeStyle='#9aa3aa';ctx.lineWidth=3*u;ctx.beginPath();ctx.moveTo(L+8*u,B);ctx.lineTo(L+16*u,26*u);ctx.moveTo(R-8*u,B);ctx.lineTo(R-16*u,26*u);ctx.moveTo(L+16*u,26*u);ctx.lineTo(R-16*u,26*u);ctx.stroke();
    for(const wx of [-34*u,34*u]){
      ctx.fillStyle='#2b2f33';ctx.beginPath();ctx.arc(wx,30*u,9*u,0,7);ctx.fill();
      ctx.fillStyle='#aeb6bc';ctx.beginPath();ctx.arc(wx,30*u,4*u,0,7);ctx.fill();
      ctx.strokeStyle='#2b2f33';ctx.lineWidth=1.5*u;ctx.save();ctx.translate(wx,30*u);ctx.rotate(x/(9*u));ctx.beginPath();ctx.moveTo(-4*u,0);ctx.lineTo(4*u,0);ctx.stroke();ctx.restore();

}
function drawStation(){
  const t=Date.now()/1000,pw=93*u;
  if(occO){const g=ctx.createLinearGradient(0,topY-70*u,0,topY);g.addColorStop(0,'rgba(255,120,30,0)');g.addColorStop(1,'rgba(255,100,20,.5)');ctx.fillStyle=g;ctx.fillRect(ccx-97*u,topY-62*u,pw,62*u);}

    ctx.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<4;i++){const y=(t*20+i*14)%50;ctx.beginPath();ctx.arc(ccx+20*u+i*22*u+Math.sin(t*2+i)*5*u,topY-62*u-y*u,(7+y/6)*u,0,7);ctx.fill();}}
}
function drawCheckout(){
  const t=Date.now(),x0=90*u,x1=170*u,tot=rec.reduce((a,r)=>a+r.p,0);
  ctx.fillStyle='#6d7882';ctx.fillRect(124*u,topC-62*u,10*u,62*u);

  ctx.font='700 '+(16*u)+'px ui-monospace,Menlo,monospace';ctx.fillStyle='#ffd54a';ctx.fillText('TOTAL $'+tot.toFixed(2),34*u,topC-76*u);

function drawPeek(){

    ctx.strokeStyle='#fff';ctx.lineWidth=1.8*u;ctx.beginPath();ctx.moveTo(x-3*u,y);ctx.lineTo(x-.8*u,y+2.5*u);ctx.lineTo(x+3.2*u,y-2.8*u);ctx.stroke();}

}
const inBag=b=>b.position.x>bagL&&b.position.x<bagR&&b.position.y>bagTop;

function drawBagFront(){
  if(bagAnim)return;

  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2*u;ctx.strokeRect(bagL,bagTop,bagR-bagL,floorY-bagTop);

function drawBagAnim(){
  if(!bagAnim)return;const el=(Date.now()-bagAnim.t0)/1000;
  if(el>2.6){bagAnim=null;return;}
  const e=Math.max(0,el-.7)/1.9,x=bagCx+e*e*(W-bagCx+130*u),lift=Math.sin(Math.min(1,el/.7)*Math.PI/2)*30*u,by=floorY-lift;

  ctx.textAlign='left';
}
function takeHome(){
  audio();if(bagAnim)return;
  const its=items.filter(inBag);
  if(!its.length){lastScan={n:'Bag is empty',p:null,t:Date.now()};return;}
  bagAnim={t0:Date.now(),cols:its.slice(0,8).map(b=>colorOf(b.mk)),n:its.length};

function frame(){

function hold(id,d){const el=document.getElementById(id);

  const up=()=>{if(dir===d)dir=0;};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);}
const rc=document.getElementById('rcpt');
function printReceipt(){
  audio();

  const tot=rec.reduce((a,r)=>a+r.p,0),pad=(a,b)=>a+' '.repeat(Math.max(1,20-a.length-b.length))+b;

  const m=b.mk;if(m.scanned)return;m.scanned=true;m.scanFlash=Date.now();
